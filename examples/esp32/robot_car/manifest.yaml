spec_version: "0.1"

device:
  id: robot_car_01
  type: mobile_robot
  name: ESP32-S3 Robot Car
  metadata:
    platform: esp32-s3

capabilities:
  - name: camera.capture
    description: Capture one image from the front camera.
    kind: sensor

  - name: servo.pan
    description: Rotate the camera pan servo.
    kind: action
    parameters:
      type: object
      properties:
        angle:
          type: number
          minimum: -90
          maximum: 90
      required: [angle]

  - name: led.set
    description: Set the status LED.
    kind: action
    parameters:
      type: object
      properties:
        on:
          type: boolean
      required: [on]

  - name: motor.move
    description: Drive the robot in a direction for a bounded time.
    kind: action
    parameters:
      type: object
      properties:
        direction:
          type: string
          enum: [forward, backward, left, right]
        speed:
          type: number
          minimum: 0
          maximum: 1
        duration_s:
          type: number
          minimum: 0
          maximum: 5
      required: [direction, speed, duration_s]
    returns:
      type: object
      properties:
        duration_s:
          type: number
    safety:
      local_allowed: true
      max_rate_hz: 10

  - name: motor.stop
    description: Stop the robot immediately.
    kind: action
    safety:
      local_allowed: true
      emergency: true
